          jar tf "$JAR" | grep -q 'pl/mrstudios/deathrun/classic/playtest/ClassicPlaytestService.class'
          jar tf "$JAR" | grep -q 'pl/mrstudios/deathrun/classic/vote/ClassicVoteService.class'
          jar tf "$JAR" | grep -q 'pl/mrstudios/deathrun/arena/listener/ClassicTrapEffectListener.class'
          ! jar tf "$JAR" | grep -q 'net/kyori/adventure/platform/bukkit/BukkitAudiences.class'
          ! grep -R "BukkitAudiences" core/src/main/java
          unzip -p "$JAR" plugin.yml | grep -q 'api-version: "26.2"'
          unzip -p "$JAR" plugin.yml | grep -q -- '- "WorldEdit"'

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: DeathRun-Classic26
          path: core/build/libs/DeathRun-Classic26-*.jar
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Download built DeathRun plugin
        uses: actions/download-artifact@v8
        with:
          name: DeathRun-Classic26
          path: smoke/plugins

      - name: Download Paper 26.2 and WorldEdit 7.4.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          UA='DeathRun-Classic26-CI/1.0 (https://github.com/Carloslixiang-max/DeathRun-Classic26)'

          BUILDS="$(curl -fsSL -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.2/builds)"
          PAPER_URL="$(printf '%s' "$BUILDS" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')"
          test -n "$PAPER_URL"
          curl -fsSL -H "User-Agent: $UA" "$PAPER_URL" -o smoke/paper.jar

          WE_URL='https://mediafilez.forgecdn.net/files/8607/421/worldedit-bukkit-7.4.5.jar'
          if ! curl -fsSL -A "$UA" "$WE_URL" -o smoke/plugins/WorldEdit-7.4.5.jar; then
            WE_URL='https://edge.forgecdn.net/files/8607/421/worldedit-bukkit-7.4.5.jar'
            curl -fsSL -A "$UA" "$WE_URL" -o smoke/plugins/WorldEdit-7.4.5.jar
          fi

          test -s smoke/paper.jar
          test -s smoke/plugins/WorldEdit-7.4.5.jar

      - name: Boot Paper 26.2 with DeathRun
        shell: bash
        run: |
          set -euo pipefail
          cd smoke

          dump_logs_on_failure() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              echo '=== DeathRun smoke failure diagnostics ==='
              if [ -f server.log ]; then
                echo '--- server.log ---'
                cat server.log
              fi
              if [ -f server-restart.log ]; then
                echo '--- server-restart.log ---'
                cat server-restart.log
              fi
            fi
            exit "$status"
          }

          stop_server_process() {
            pid="$1"

            # Paper can finish writing its final log lines before every JVM
            # worker has actually exited. Give it a graceful window first.
            for _ in $(seq 1 30); do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" 2>/dev/null || true
                return 0
              fi
              sleep 1
            done

            echo "Paper process $pid still alive after graceful stop; sending TERM."
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" 2>/dev/null || true
                return 0
              fi
              sleep 1
            done

            echo "Paper process $pid still alive after TERM; sending KILL."
            kill -9 "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            ! kill -0 "$pid" 2>/dev/null
          }

          trap dump_logs_on_failure EXIT

          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          level-name=world
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          max-players=4
          EOF

          # Legacy datapack scanner fixture. It is intentionally never executed;
          # the scanner must recover exactly the relevant commands from disk.
          mkdir -p world/datapacks/classic26-fixture/data/deathrun/function
          cat > world/datapacks/classic26-fixture/pack.mcmeta <<'EOF'
          {"pack":{"pack_format":94,"description":"DeathRun Classic26 legacy scanner fixture"}}
          EOF
          cat > world/datapacks/classic26-fixture/data/deathrun/function/fixture.mcfunction <<'EOF'
          # scanner fixture
          fill 0 70 0 2 70 2 air
          tp @a 10 80 10
          execute as @a at @s run setblock ~ ~-1 ~ stone
          say this-line-must-not-be-reported
          EOF

          mkfifo server.in
          exec 3<>server.in
          java -Xms512M -Xmx1024M -jar paper.jar --nogui <server.in > server.log 2>&1 &
          PID=$!

          READY=0
          for _ in $(seq 1 120); do
            if grep -q 'Done (' server.log; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          test "$READY" -eq 1

          # Exercise real Classic26 world creation, map serialization, trap
          # registration and runtime reload inside a live Paper process.
          printf 'dr playtest create\n' >&3
          PLAYTEST=0
          for _ in $(seq 1 60); do
            if grep -q 'Rebuilt full Classic26 engineering playtest map classic26-playtest with 17 trap types' server.log; then
              PLAYTEST=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          printf 'dr playtest verify\n' >&3
          VERIFY1=0
          for _ in $(seq 1 30); do
            if grep -q 'Classic26 playtest verification PASS' server.log; then
              VERIFY1=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$VERIFY1" -eq 1

          # Exercise a real Paper 26.2 map backup/restore cycle. World#getWorldFolder()
          # points into the 26.2 dimensions layout, so this specifically protects
          # against accidentally restoring backups into the obsolete root layout.
          printf 'dr map backup classic26-playtest\n' >&3
          BACKUP_OK=0
          for _ in $(seq 1 45); do
            if grep -q 'Backup refreshed for map classic26-playtest' server.log; then
              BACKUP_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$BACKUP_OK" -eq 1
          test -s plugins/DeathRun/backup/deathrun_playtest.zip

          printf 'dr map restore classic26-playtest\n' >&3
          RESTORE_OK=0
          for _ in $(seq 1 90); do
            if grep -q 'Restored world deathrun_playtest for map classic26-playtest' server.log; then
              RESTORE_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$RESTORE_OK" -eq 1

          PASS_BEFORE_RESTORE_VERIFY=$(grep -c 'Classic26 playtest verification PASS' server.log || true)
          printf 'dr playtest verify\n' >&3
          VERIFY_RESTORE=0
          for _ in $(seq 1 45); do
            PASS_NOW=$(grep -c 'Classic26 playtest verification PASS' server.log || true)
            if [ "$PASS_NOW" -gt "$PASS_BEFORE_RESTORE_VERIFY" ]; then
              VERIFY_RESTORE=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$VERIFY_RESTORE" -eq 1

          printf 'dr map manifest classic26-playtest\n' >&3
          MANIFEST_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'Map manifest complete: classic26-playtest' server.log; then
              MANIFEST_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$MANIFEST_OK" -eq 1

          printf 'dr map legacyfilescan classic26-playtest\n' >&3
          LEGACY_FILE_SCAN_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'Legacy datapack scan complete for classic26-playtest' server.log; then
              LEGACY_FILE_SCAN_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$LEGACY_FILE_SCAN_OK" -eq 1
          LEGACY_REPORT='plugins/DeathRun/research/classic26-playtest-legacy-functions.txt'
          test -s "$LEGACY_REPORT"
          grep -q 'summary functionFiles=1 relevantCommands=3 .*truncated=false' "$LEGACY_REPORT"
          grep -q 'fill 0 70 0 2 70 2 air' "$LEGACY_REPORT"
          grep -q 'execute as @a at @s run setblock ~ ~-1 ~ stone' "$LEGACY_REPORT"
          ! grep -q 'say this-line-must-not-be-reported' "$LEGACY_REPORT"

          printf 'dr map check classic26-playtest\n' >&3
          MAP_CHECK_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'classic26-playtest.*healthy' server.log; then
              MAP_CHECK_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$MAP_CHECK_OK" -eq 1

          printf 'dr map session classic26-playtest\n' >&3
          SESSION_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'Session classic26-playtest.*state=WAITING.*users=0.*queued=0' server.log; then
              SESSION_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$SESSION_OK" -eq 1

          printf 'dr map trace start classic26-playtest\n' >&3
          TRACE_REPORT='plugins/DeathRun/research/classic26-playtest-playtest-trace.log'
          TRACE_START_OK=0
          for _ in $(seq 1 30); do
            if [ -s "$TRACE_REPORT" ] && grep -q 'TRACE_START' "$TRACE_REPORT"; then
              TRACE_START_OK=1
              break
            fi
            sleep 1
          done
          test "$TRACE_START_OK" -eq 1
          grep -q 'SESSION_SNAPSHOT.*state=WAITING.*users=0.*queued=0' "$TRACE_REPORT"

          printf 'dr map trace status classic26-playtest\n' >&3
          sleep 1
          grep -q 'Trace classic26-playtest.*enabled=true' server.log

          printf 'dr map trace stop classic26-playtest\n' >&3
          TRACE_STOP_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'TRACE_STOP' "$TRACE_REPORT"; then
              TRACE_STOP_OK=1
              break
            fi
            sleep 1
          done
          test "$TRACE_STOP_OK" -eq 1

          printf 'dr map trace acceptance classic26-playtest\n' >&3
          ACCEPTANCE_CMD_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'Acceptance classic26-playtest: INCOMPLETE' server.log; then
              ACCEPTANCE_CMD_OK=1
              break
            fi
            sleep 1
          done
          test "$ACCEPTANCE_CMD_OK" -eq 1

          printf 'stop\n' >&3 || true
          exec 3>&-
          stop_server_process "$PID"

          cat server.log
          test "$PLAYTEST" -eq 1
          grep -Eq 'Enabling DeathRun|Enabled DeathRun|DeathRun v1\.4\.1-classic26\.1' server.log
          grep -q 'Registered listeners via reflection:' server.log
          ! grep -Eq 'Error occurred while enabling DeathRun|Could not load.*DeathRun|UnknownDependencyException.*WorldEdit|NoClassDefFoundError.*deathrun' server.log
          ! grep -Eq 'Failed to register listener via reflection|\[DeathRun\].*SEVERE|ERROR\]: \[DeathRun\]|\[DR-START\].*Fatal arena tick failure' server.log

          # Restart the exact same server once more. This verifies that the
          # generated map.yml can deserialize every persisted Classic trap and
          # rebuild its runtime cleanly after a real shutdown.
          # The first JVM must be completely gone before the same world and
          # listen socket are opened again. This avoids flaky level/session locks.
          if kill -0 "$PID" 2>/dev/null; then
            echo "First Paper JVM is still alive before restart."
            exit 1
          fi
          sleep 2

          rm -f server.in
          mkfifo server.in
          exec 4<>server.in
          java -Xms512M -Xmx1024M -jar paper.jar --nogui <server.in > server-restart.log 2>&1 &
          PID2=$!

          READY2=0
          for _ in $(seq 1 120); do
            if grep -q 'Done (' server-restart.log; then
              READY2=1
              break
            fi
            if ! kill -0 "$PID2" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY2" -ne 1 ]; then
            echo 'Second Paper boot did not reach Done().'
            exit 1
          fi

          # Re-run the structural audit after deserialization. This catches
          # silent loss of spawn, checkpoint, barrier, trap or runtime data.
          printf 'dr playtest verify\n' >&4
          VERIFY2=0
          for _ in $(seq 1 30); do
            if grep -q 'Classic26 playtest verification PASS' server-restart.log; then
              VERIFY2=1
              break
            fi
            if ! kill -0 "$PID2" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$VERIFY2" -eq 1
          printf 'stop\n' >&4 || true
          exec 4>&-
          stop_server_process "$PID2"

          cat server-restart.log
          grep -Eq 'Enabling DeathRun|Enabled DeathRun|DeathRun v1\.4\.1-classic26\.1' server-restart.log
          grep -q 'Registered listeners via reflection:' server-restart.log
          ! grep -Eq 'SerializerException|Unable to deserialize|Error occurred while enabling DeathRun|Could not load.*DeathRun|NoClassDefFoundError.*deathrun' server-restart.log
          ! grep -Eq 'Failed to register listener via reflection|\[DeathRun\].*SEVERE|ERROR\]: \[DeathRun\]|\[DR-START\].*Fatal arena tick failure' server-restart.log
