name: Build DeathRun Classic26

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deathrun-classic26-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap CIlie23 DeathRun 1.4.1 source
        if: ${{ hashFiles('core/build.gradle.kts') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream https://github.com/CIlie23/DeathRun.git || true
          git fetch --no-tags upstream ver/latest
          git merge --allow-unrelated-histories --no-edit upstream/ver/latest

          # The upstream branch contains its own workflow. GitHub's GITHUB_TOKEN
          # cannot introduce a new workflow file without workflows permission,
          # so keep our Classic26 workflow and drop the imported one.
          git rm -f .github/workflows/build.yml || true
          git commit --amend --no-edit

          git push origin HEAD:main

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Java 25 / Paper 26.2 plugin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean shadowJar --stacktrace --no-daemon

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeathRun-Classic26-dev
          path: core/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
