name: Build DeathRun Classic26

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deathrun-classic26-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bootstrap CIlie23 DeathRun 1.4.1 source
        if: ${{ hashFiles('core/build.gradle.kts') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream https://github.com/CIlie23/DeathRun.git || true
          git fetch --no-tags upstream ver/latest
          git merge --allow-unrelated-histories --no-edit upstream/ver/latest

          # The upstream branch contains its own workflow. GitHub's GITHUB_TOKEN
          # cannot introduce a new workflow file without workflows permission,
          # so keep our Classic26 workflow and drop the imported one.
          git rm -f .github/workflows/build.yml || true
          git commit --amend --no-edit

          git push origin HEAD:main

      - name: Verify Anvil archive probe
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_anvil_probe.py
          python3 tools/test_anvil_cluster.py
          python3 tools/test_leveldat_probe.py
          python3 tools/test_anvil_topology.py
          python3 tools/test_anvil_sign_links.py
          python3 tools/test_anvil_trap_evidence.py
          python3 tools/test_anvil_route_evidence.py
          python3 tools/test_anvil_entity_evidence.py
          python3 tools/test_anvil_block_entity_evidence.py
          python3 tools/test_anvil_stage_evidence.py

          ROOT='/tmp/deathrun-archive-probe'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/toxic-factory" "$ROOT/to-bee-or-not-to-bee"

          # Public HiveMC archive fixtures are downloaded only into the ephemeral
          # Actions workspace. The third-party world binaries are never committed
          # or uploaded as artifacts by this repository.
          TOXIC_COMMIT='1960b554e5e643d3cedffeee006025381f88c322'
          TO_BEE_COMMIT='9a5b49593be61716ff3419aff24ce313567df14f'

          TOXIC_BASE="https://raw.githubusercontent.com/Mqzn/HiveMCMaps/$TOXIC_COMMIT/death-run/toxic-factory/region"
          for region in 'r.-1.-1.mca' 'r.-1.0.mca' 'r.0.0.mca'; do
            curl -fsSL --retry 3 --retry-delay 2 "$TOXIC_BASE/$region" -o "$ROOT/toxic-factory/$region"
          done

          TOXIC_MAP_BASE="https://raw.githubusercontent.com/Mqzn/HiveMCMaps/$TOXIC_COMMIT/death-run/toxic-factory"
          TO_BEE_MAP_BASE="https://raw.githubusercontent.com/Mqzn/HiveMCMaps/$TO_BEE_COMMIT/death-run/to-bee-or-not-to-bee"
          curl -fsSL --retry 3 --retry-delay 2 "$TOXIC_MAP_BASE/level.dat" -o "$ROOT/toxic-factory-level.dat"
          curl -fsSL --retry 3 --retry-delay 2 "$TO_BEE_MAP_BASE/level.dat" -o "$ROOT/to-bee-or-not-to-bee-level.dat"

          TO_BEE_BASE="https://raw.githubusercontent.com/Mqzn/HiveMCMaps/$TO_BEE_COMMIT/death-run/to-bee-or-not-to-bee/region"
          for region in 'r.-1.-1.mca' 'r.-1.0.mca' 'r.0.-1.mca' 'r.0.0.mca'; do
            curl -fsSL --retry 3 --retry-delay 2 "$TO_BEE_BASE/$region" -o "$ROOT/to-bee-or-not-to-bee/$region"
          done

          python3 tools/anvil_probe.py --world-name toxic-factory             --output "$ROOT/toxic-factory-probe.txt"             --min-chunks 1 --min-candidates 1             "$ROOT/toxic-factory"

          python3 tools/anvil_probe.py --world-name to-bee-or-not-to-bee             --output "$ROOT/to-bee-or-not-to-bee-probe.txt"             --min-chunks 1 --min-candidates 1             "$ROOT/to-bee-or-not-to-bee"

          echo '--- To Bee archived sign evidence (first 100) ---'
          awk 'BEGIN { n=0 } /^SIGN/ { print; n++; if (n >= 100) exit 0 }' "$ROOT/to-bee-or-not-to-bee-probe.txt"
          echo '--- Toxic Factory archived sign evidence (first 100) ---'
          awk 'BEGIN { n=0 } /^SIGN/ { print; n++; if (n >= 100) exit 0 }' "$ROOT/toxic-factory-probe.txt"

          python3 tools/anvil_sign_links.py \
            "$ROOT/to-bee-or-not-to-bee-probe.txt" \
            --output "$ROOT/to-bee-or-not-to-bee-sign-links.txt" \
            --nearby-radius 9 --facing-min-dot 0.70 --min-actions 1
          python3 tools/anvil_sign_links.py \
            "$ROOT/toxic-factory-probe.txt" \
            --output "$ROOT/toxic-factory-sign-links.txt" \
            --nearby-radius 9 --facing-min-dot 0.70 --min-actions 0
          cat "$ROOT/to-bee-or-not-to-bee-sign-links.txt"
          grep '^sign_link_summary ' "$ROOT/toxic-factory-sign-links.txt"

          python3 tools/anvil_trap_evidence.py \
            "$ROOT/to-bee-or-not-to-bee-probe.txt" \
            --output "$ROOT/to-bee-or-not-to-bee-trap-evidence.txt" \
            --top-candidates 3 --nearby-distance 30 \
            --min-actions 1 --min-warnings 1
          python3 tools/anvil_trap_evidence.py \
            "$ROOT/toxic-factory-probe.txt" \
            --output "$ROOT/toxic-factory-trap-evidence.txt" \
            --top-candidates 3 --nearby-distance 30 \
            --min-actions 0 --min-warnings 1
          cat "$ROOT/to-bee-or-not-to-bee-trap-evidence.txt"
          grep '^trap_evidence_summary ' "$ROOT/toxic-factory-trap-evidence.txt"

          python3 tools/anvil_route_evidence.py \
            "$ROOT/to-bee-or-not-to-bee-probe.txt" \
            --output "$ROOT/to-bee-or-not-to-bee-route-evidence.txt" \
            --min-numeric 1
          python3 tools/anvil_route_evidence.py \
            "$ROOT/toxic-factory-probe.txt" \
            --output "$ROOT/toxic-factory-route-evidence.txt" \
            --min-numeric 1
          cat "$ROOT/to-bee-or-not-to-bee-route-evidence.txt"
          grep '^route_evidence_summary ' "$ROOT/toxic-factory-route-evidence.txt"
          grep '^ROUTE_SIGN' "$ROOT/toxic-factory-route-evidence.txt" || true

          python3 tools/anvil_entity_evidence.py \
            --world-name to-bee-or-not-to-bee \
            --output "$ROOT/to-bee-or-not-to-bee-entity-evidence.txt" \
            --min-chunks 1 "$ROOT/to-bee-or-not-to-bee"
          python3 tools/anvil_entity_evidence.py \
            --world-name toxic-factory \
            --output "$ROOT/toxic-factory-entity-evidence.txt" \
            --min-chunks 1 "$ROOT/toxic-factory"
          cat "$ROOT/to-bee-or-not-to-bee-entity-evidence.txt"
          grep '^entity_evidence_summary ' "$ROOT/toxic-factory-entity-evidence.txt"
          grep '^ENTITY_EVIDENCE' "$ROOT/toxic-factory-entity-evidence.txt" | head -n 100 || true

          python3 tools/anvil_block_entity_evidence.py \
            --world-name to-bee-or-not-to-bee \
            --output "$ROOT/to-bee-or-not-to-bee-block-entity-evidence.txt" \
            --min-chunks 1 "$ROOT/to-bee-or-not-to-bee"
          python3 tools/anvil_block_entity_evidence.py \
            --world-name toxic-factory \
            --output "$ROOT/toxic-factory-block-entity-evidence.txt" \
            --min-chunks 1 "$ROOT/toxic-factory"
          cat "$ROOT/to-bee-or-not-to-bee-block-entity-evidence.txt"
          grep '^block_entity_summary ' "$ROOT/toxic-factory-block-entity-evidence.txt"
          grep '^BLOCK_ENTITY_EVIDENCE' "$ROOT/toxic-factory-block-entity-evidence.txt" | head -n 100 || true

          echo '--- To Bee container inventory evidence ---'
          grep '^block_entity_summary ' "$ROOT/to-bee-or-not-to-bee-block-entity-evidence.txt"
          grep '^INVENTORY_ITEM_TYPE' "$ROOT/to-bee-or-not-to-bee-block-entity-evidence.txt" || true
          grep '^BLOCK_ENTITY_INVENTORY' "$ROOT/to-bee-or-not-to-bee-block-entity-evidence.txt" | head -n 120 || true
          echo '--- Toxic Factory container inventory evidence ---'
          grep '^INVENTORY_ITEM_TYPE' "$ROOT/toxic-factory-block-entity-evidence.txt" || true
          grep '^BLOCK_ENTITY_INVENTORY' "$ROOT/toxic-factory-block-entity-evidence.txt" | head -n 120 || true

          echo '--- To Bee mechanism BlockState evidence ---'
          awk -F '\t' '$1 == "BLOCK" && $2 == "MECHANISM" { print; n++; if (n >= 160) exit }' "$ROOT/to-bee-or-not-to-bee-probe.txt"
          echo '--- Toxic Factory mechanism BlockState evidence ---'
          awk -F '\t' '$1 == "BLOCK" && $2 == "MECHANISM" { print; n++; if (n >= 160) exit }' "$ROOT/toxic-factory-probe.txt"

          python3 tools/anvil_stage_evidence.py \
            "$ROOT/to-bee-or-not-to-bee-probe.txt" \
            "$ROOT/to-bee-or-not-to-bee-entity-evidence.txt" \
            "$ROOT/to-bee-or-not-to-bee-block-entity-evidence.txt" \
            --output "$ROOT/to-bee-or-not-to-bee-stage-evidence.txt" \
            --horizontal-radius 12 --vertical-radius 10 --min-stage-markers 2
          python3 tools/anvil_stage_evidence.py \
            "$ROOT/toxic-factory-probe.txt" \
            "$ROOT/toxic-factory-entity-evidence.txt" \
            "$ROOT/toxic-factory-block-entity-evidence.txt" \
            --output "$ROOT/toxic-factory-stage-evidence.txt" \
            --horizontal-radius 12 --vertical-radius 10 --min-stage-markers 0
          cat "$ROOT/to-bee-or-not-to-bee-stage-evidence.txt"
          grep '^stage_evidence_summary ' "$ROOT/toxic-factory-stage-evidence.txt"

          python3 tools/leveldat_probe.py --require-spawn "$ROOT/toxic-factory-level.dat" --output "$ROOT/toxic-factory-leveldat.txt"
          python3 tools/leveldat_probe.py --require-spawn "$ROOT/to-bee-or-not-to-bee-level.dat" --output "$ROOT/to-bee-or-not-to-bee-leveldat.txt"
          cat "$ROOT/toxic-factory-leveldat.txt"
          cat "$ROOT/to-bee-or-not-to-bee-leveldat.txt"

          python3 tools/anvil_cluster.py \
            "$ROOT/to-bee-or-not-to-bee-probe.txt" \
            --output "$ROOT/to-bee-or-not-to-bee-clusters.txt" \
            --radius 4 --vertical-radius 3 --mode local --members-limit 4 \
            --min-points 1 --min-clusters 1

          grep '^summary ' "$ROOT/to-bee-or-not-to-bee-clusters.txt"
          grep '^categories ' "$ROOT/to-bee-or-not-to-bee-clusters.txt"
          awk 'BEGIN { n=0 } /^CLUSTER/ { print; n++; if (n >= 20) exit 0 }' "$ROOT/to-bee-or-not-to-bee-clusters.txt"

          python3 tools/anvil_topology.py \
            "$ROOT/to-bee-or-not-to-bee-probe.txt" \
            --output "$ROOT/to-bee-or-not-to-bee-topology.txt" \
            --min-pressure-components 1 --min-portal-components 1
          grep '^topology_summary ' "$ROOT/to-bee-or-not-to-bee-topology.txt"
          grep '^pressure_plate_materials ' "$ROOT/to-bee-or-not-to-bee-topology.txt"
          grep '^portal_materials ' "$ROOT/to-bee-or-not-to-bee-topology.txt"
          awk 'BEGIN { n=0 } /^PRESSURE_PLATE_COMPONENT/ { print; n++; if (n >= 25) exit 0 }' "$ROOT/to-bee-or-not-to-bee-topology.txt"
          awk 'BEGIN { n=0 } /^PORTAL_COMPONENT/ { print; n++; if (n >= 20) exit 0 }' "$ROOT/to-bee-or-not-to-bee-topology.txt"

          for report in "$ROOT/toxic-factory-probe.txt" "$ROOT/to-bee-or-not-to-bee-probe.txt"; do
            grep -Eq '^summary regions=[1-9][0-9]* chunks=[1-9][0-9]* .*candidate_blocks=[1-9][0-9]*' "$report"
            grep '^summary ' "$report"
            awk -F '\t' '$1 == "BLOCK" { count[$2]++ } END { for (key in count) print "category " key "=" count[key] }' "$report" | sort
          done

      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Java 25 / Paper 26.2 plugin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean test shadowJar --stacktrace --no-daemon

      - name: Verify packaged plugin
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find core/build/libs -maxdepth 1 -name 'DeathRun-Classic26-*.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'pl/mrstudios/deathrun/classic/playtest/ClassicPlaytestService.class'
          jar tf "$JAR" | grep -q 'pl/mrstudios/deathrun/classic/vote/ClassicVoteService.class'
          jar tf "$JAR" | grep -q 'pl/mrstudios/deathrun/arena/listener/ClassicTrapEffectListener.class'
          ! jar tf "$JAR" | grep -q 'net/kyori/adventure/platform/bukkit/BukkitAudiences.class'
          ! grep -R "BukkitAudiences" core/src/main/java
          unzip -p "$JAR" plugin.yml | grep -q 'api-version: "26.2"'
          unzip -p "$JAR" plugin.yml | grep -q -- '- "WorldEdit"'

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: DeathRun-Classic26
          path: core/build/libs/DeathRun-Classic26-*.jar
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Download built DeathRun plugin
        uses: actions/download-artifact@v8
        with:
          name: DeathRun-Classic26
          path: smoke/plugins

      - name: Download Paper 26.2 and WorldEdit 7.4.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          UA='DeathRun-Classic26-CI/1.0 (https://github.com/Carloslixiang-max/DeathRun-Classic26)'

          BUILDS="$(curl -fsSL -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.2/builds)"
          PAPER_URL="$(printf '%s' "$BUILDS" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')"
          test -n "$PAPER_URL"
          curl -fsSL -H "User-Agent: $UA" "$PAPER_URL" -o smoke/paper.jar

          WE_URL='https://mediafilez.forgecdn.net/files/8607/421/worldedit-bukkit-7.4.5.jar'
          if ! curl -fsSL -A "$UA" "$WE_URL" -o smoke/plugins/WorldEdit-7.4.5.jar; then
            WE_URL='https://edge.forgecdn.net/files/8607/421/worldedit-bukkit-7.4.5.jar'
            curl -fsSL -A "$UA" "$WE_URL" -o smoke/plugins/WorldEdit-7.4.5.jar
          fi

          test -s smoke/paper.jar
          test -s smoke/plugins/WorldEdit-7.4.5.jar

      - name: Boot Paper 26.2 with DeathRun
        shell: bash
        run: |
          set -euo pipefail
          cd smoke

          dump_logs_on_failure() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              echo '=== DeathRun smoke failure diagnostics ==='
              if [ -f server.log ]; then
                echo '--- server.log ---'
                cat server.log
              fi
              if [ -f server-restart.log ]; then
                echo '--- server-restart.log ---'
                cat server-restart.log
              fi
            fi
            exit "$status"
          }

          stop_server_process() {
            pid="$1"

            # Paper can finish writing its final log lines before every JVM
            # worker has actually exited. Give it a graceful window first.
            for _ in $(seq 1 30); do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" 2>/dev/null || true
                return 0
              fi
              sleep 1
            done

            echo "Paper process $pid still alive after graceful stop; sending TERM."
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" 2>/dev/null || true
                return 0
              fi
              sleep 1
            done

            echo "Paper process $pid still alive after TERM; sending KILL."
            kill -9 "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            ! kill -0 "$pid" 2>/dev/null
          }

          trap dump_logs_on_failure EXIT

          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          level-name=world
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          max-players=4
          EOF

          # Legacy datapack scanner fixture. It is intentionally never executed;
          # the scanner must recover exactly the relevant commands from disk.
          mkdir -p world/datapacks/classic26-fixture/data/deathrun/function
          cat > world/datapacks/classic26-fixture/pack.mcmeta <<'EOF'
          {"pack":{"pack_format":94,"description":"DeathRun Classic26 legacy scanner fixture"}}
          EOF
          cat > world/datapacks/classic26-fixture/data/deathrun/function/fixture.mcfunction <<'EOF'
          # scanner fixture
          fill 0 70 0 2 70 2 air
          tp @a 10 80 10
          execute as @a at @s run setblock ~ ~-1 ~ stone
          say this-line-must-not-be-reported
          EOF

          mkfifo server.in
          exec 3<>server.in
          java -Xms512M -Xmx1024M -jar paper.jar --nogui <server.in > server.log 2>&1 &
          PID=$!

          READY=0
          for _ in $(seq 1 120); do
            if grep -q 'Done (' server.log; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          test "$READY" -eq 1

          # Exercise real Classic26 world creation, map serialization, trap
          # registration and runtime reload inside a live Paper process.
          printf 'dr playtest create\n' >&3
          PLAYTEST=0
          for _ in $(seq 1 60); do
            if grep -q 'Rebuilt full Classic26 engineering playtest map classic26-playtest with 17 trap types' server.log; then
              PLAYTEST=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          printf 'dr playtest verify\n' >&3
          VERIFY1=0
          for _ in $(seq 1 30); do
            if grep -q 'Classic26 playtest verification PASS' server.log; then
              VERIFY1=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$VERIFY1" -eq 1

          # Exercise a real Paper 26.2 map backup/restore cycle. World#getWorldFolder()
          # points into the 26.2 dimensions layout, so this specifically protects
          # against accidentally restoring backups into the obsolete root layout.
          printf 'dr map backup classic26-playtest\n' >&3
          BACKUP_OK=0
          for _ in $(seq 1 45); do
            if grep -q 'Backup refreshed for map classic26-playtest' server.log; then
              BACKUP_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$BACKUP_OK" -eq 1
          test -s plugins/DeathRun/backup/deathrun_playtest.zip

          printf 'dr map restore classic26-playtest\n' >&3
          RESTORE_OK=0
          for _ in $(seq 1 90); do
            if grep -q 'Restored world deathrun_playtest for map classic26-playtest' server.log; then
              RESTORE_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$RESTORE_OK" -eq 1

          PASS_BEFORE_RESTORE_VERIFY=$(grep -c 'Classic26 playtest verification PASS' server.log || true)
          printf 'dr playtest verify\n' >&3
          VERIFY_RESTORE=0
          for _ in $(seq 1 45); do
            PASS_NOW=$(grep -c 'Classic26 playtest verification PASS' server.log || true)
            if [ "$PASS_NOW" -gt "$PASS_BEFORE_RESTORE_VERIFY" ]; then
              VERIFY_RESTORE=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$VERIFY_RESTORE" -eq 1

          printf 'dr map manifest classic26-playtest\n' >&3
          MANIFEST_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'Map manifest complete: classic26-playtest' server.log; then
              MANIFEST_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$MANIFEST_OK" -eq 1

          printf 'dr map legacyfilescan classic26-playtest\n' >&3
          LEGACY_FILE_SCAN_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'Legacy datapack scan complete for classic26-playtest' server.log; then
              LEGACY_FILE_SCAN_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$LEGACY_FILE_SCAN_OK" -eq 1
          LEGACY_REPORT='plugins/DeathRun/research/classic26-playtest-legacy-functions.txt'
          test -s "$LEGACY_REPORT"
          grep -q 'summary functionFiles=1 relevantCommands=3 .*truncated=false' "$LEGACY_REPORT"
          grep -q 'fill 0 70 0 2 70 2 air' "$LEGACY_REPORT"
          grep -q 'execute as @a at @s run setblock ~ ~-1 ~ stone' "$LEGACY_REPORT"
          ! grep -q 'say this-line-must-not-be-reported' "$LEGACY_REPORT"

          printf 'dr map check classic26-playtest\n' >&3
          MAP_CHECK_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'classic26-playtest.*healthy' server.log; then
              MAP_CHECK_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$MAP_CHECK_OK" -eq 1

          printf 'dr map session classic26-playtest\n' >&3
          SESSION_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'Session classic26-playtest.*state=WAITING.*users=0.*queued=0' server.log; then
              SESSION_OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$SESSION_OK" -eq 1

          printf 'dr map trace start classic26-playtest\n' >&3
          TRACE_REPORT='plugins/DeathRun/research/classic26-playtest-playtest-trace.log'
          TRACE_START_OK=0
          for _ in $(seq 1 30); do
            if [ -s "$TRACE_REPORT" ] && grep -q 'TRACE_START' "$TRACE_REPORT"; then
              TRACE_START_OK=1
              break
            fi
            sleep 1
          done
          test "$TRACE_START_OK" -eq 1
          grep -q 'SESSION_SNAPSHOT.*state=WAITING.*users=0.*queued=0' "$TRACE_REPORT"

          printf 'dr map trace status classic26-playtest\n' >&3
          sleep 1
          grep -q 'Trace classic26-playtest.*enabled=true' server.log

          printf 'dr map trace stop classic26-playtest\n' >&3
          TRACE_STOP_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'TRACE_STOP' "$TRACE_REPORT"; then
              TRACE_STOP_OK=1
              break
            fi
            sleep 1
          done
          test "$TRACE_STOP_OK" -eq 1

          printf 'dr map trace acceptance classic26-playtest\n' >&3
          ACCEPTANCE_CMD_OK=0
          for _ in $(seq 1 30); do
            if grep -q 'Acceptance classic26-playtest: INCOMPLETE' server.log; then
              ACCEPTANCE_CMD_OK=1
              break
            fi
            sleep 1
          done
          test "$ACCEPTANCE_CMD_OK" -eq 1

          printf 'stop\n' >&3 || true
          exec 3>&-
          stop_server_process "$PID"

          cat server.log
          test "$PLAYTEST" -eq 1
          grep -Eq 'Enabling DeathRun|Enabled DeathRun|DeathRun v1\.4\.1-classic26\.1' server.log
          grep -q 'Registered listeners via reflection:' server.log
          ! grep -Eq 'Error occurred while enabling DeathRun|Could not load.*DeathRun|UnknownDependencyException.*WorldEdit|NoClassDefFoundError.*deathrun' server.log
